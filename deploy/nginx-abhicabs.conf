# Nginx in front of the abhicabs backend (website API, mobile app API, WhatsApp bot, Razorpay webhook).
# setup-ec2.sh replaces YOUR_DOMAIN with your real domain. Certbot then adds the HTTPS part by itself.

# Lets websocket connections (socket.io) upgrade; plain requests are left alone.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream abhicabs_backend {
    server 127.0.0.1:5000;      # must match PORT in .env (the backend's default is 5000)
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Uploads (documents, photos) and webhook bodies.
    client_max_body_size 25m;

    location / {
        proxy_pass http://abhicabs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # the backend trusts exactly one proxy
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
